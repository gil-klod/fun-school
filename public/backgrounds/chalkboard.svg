<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <pattern id="chalk" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1.2" fill="#ffffff" opacity="0.08"/>
      <circle cx="28" cy="30" r="0.9" fill="#ffffff" opacity="0.06"/>
      <circle cx="22" cy="8" r="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" fill="url(#board)"/>
  <rect width="1440" height="900" fill="url(#chalk)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3">
    <rect x="80" y="80" width="1280" height="740" rx="18"/>
  </g>
  <g fill="#ffffff" opacity="0.18" font-family="Arial, sans-serif" font-size="48" font-weight="700">
    <text x="140" y="220">2 + 2 = 4</text>
    <text x="140" y="320">ABC</text>
    <text x="140" y="420">  </text>
  </g>
  <rect x="0" y="0" width="1440" height="900" fill="#052e16" opacity="0.15"/>
</svg>
